name: fix4home
description: "fix4home project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.6
  go_router: ^14.2.0
  dio: ^5.5.0
  pretty_dio_logger: ^1.3.1
  app_links: ^6.3.2
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^10.1.0
  uuid: ^4.5.1
  google_sign_in: ^6.2.1
  jwt_decoder: ^2.0.1
  
  # Models & JSON
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0 # Added for json_serializable
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.3.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (icons, images, logos)
  assets:
    - assets/images/
    - assets/icons/
    - assets/menu/
    - assets/banners/